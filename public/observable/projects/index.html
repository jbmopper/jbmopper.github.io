        const storageKey = 'juliusm-theme';
        const modes = ['system', 'dark', 'light'];
        const labels = {system: 'System', dark: 'Dark', light: 'Light'};
        const metaColors = {dark: '#0b1017', light: '#f5f7f3'};
        const media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;

        const slot = document.getElementById('portfolio-current-project-slot');

        function readThemePreference(){
          try {
            const stored = window.localStorage.getItem(storageKey);
            if (modes.includes(stored)) return stored;
          } catch {
            return 'system';
          }
          return 'system';
        }

        function resolveThemePreference(preference){
          if (preference === 'light' || (preference === 'system' && media && media.matches)) return 'light';
          return 'dark';
        }

        function nextThemePreference(preference){
          return modes[(modes.indexOf(preference) + 1) % modes.length] || 'system';
        }

        function updateThemeControls(preference, resolved){
          document.querySelectorAll('[data-theme-control]').forEach(function(control){
            const next = nextThemePreference(preference);
            control.dataset.themePreference = preference;
            control.dataset.themeResolved = resolved;
            control.setAttribute('aria-label', 'Theme: ' + labels[preference] + '. Switch to ' + labels[next] + '.');
            control.setAttribute('title', 'Theme: ' + labels[preference]);
            const label = control.querySelector('[data-theme-label]');
            if (label) label.textContent = labels[preference];
          });
        }

        function applyThemePreference(preference, persist){
          const normalizedPreference = modes.includes(preference) ? preference : 'system';
          const resolved = resolveThemePreference(normalizedPreference);
          document.documentElement.dataset.theme = normalizedPreference;
          document.documentElement.dataset.themeResolved = resolved;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', metaColors[resolved]);
          if (persist) {
            try {
              window.localStorage.setItem(storageKey, normalizedPreference);
            } catch {}
          }
          updateThemeControls(normalizedPreference, resolved);
        }

        function bindThemeControls(){
          document.querySelectorAll('[data-theme-control]').forEach(function(control){
            if (control.dataset.themeBound === 'true') return;
            control.dataset.themeBound = 'true';
            control.addEventListener('click', function(){
              applyThemePreference(nextThemePreference(readThemePreference()), true);
            });
          });
          applyThemePreference(readThemePreference(), false);
        }

        applyThemePreference(readThemePreference(), false);
        bindThemeControls();
        if (media) media.addEventListener('change', function(){
          if (readThemePreference() === 'system') applyThemePreference('system', false);

                ['Benchmarks and Empirical Performance Analysis', '/projects/llm-fundamentals/perf-empirical/'],
                ['Nvidia CUDA Nsys Trace Analysis', '/projects/llm-fundamentals/nsys/'],
                ['Nsys GPU Trace Viewer', '/projects/llm-fundamentals/nsys-viewer/'],
                ['Learning Parameter Sweeps', '/projects/llm-fundamentals/optimizer-sweep/'],
                ['Architectural Variations (Ablations)', '/projects/llm-fundamentals/ablations/']
              ];
              for (const [label, target] of items) {
                dropdown.appendChild(makeProjectItem(label, mount + target));
              }
              details.appendChild(dropdown);
              slot.appendChild(details);

              document.addEventListener('click', function(event){
                if (!details.hasAttribute('open')) return;
                if (!details.contains(event.target)) details.removeAttribute('open');
              });
              document.addEventListener('keydown', function(event){
                if (event.key === 'Escape') details.removeAttribute('open');
              });
            } else if (slug === 'resume-generator') {
              slot.appendChild(makeNavLink('Resume Generator', mount + '/projects/resume-generator/'));
            } else {
              const labels = {
                'resume-generator': 'Resume Generator',
                'data-playground': 'Data Playground',
                'site-chatbot': 'Site Design and RAG Chatbot Integration'
              };
              const fallback = slug
                .split('-')
                .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
                .join(' ');
              slot.appendChild(makeNavLink(labels[slug] || fallback, mount + '/projects/' + slug + '/'));
            }
