name: Infra Validate and Plan

on:
  pull_request:
    paths:
      - "infra/**"
      - "scripts/test-infra-lambdas.sh"
      - ".github/workflows/infra-plan.yml"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "scripts/test-infra-lambdas.sh"
      - ".github/workflows/infra-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-west-2

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Run infra Lambda unit tests
        run: ./scripts/test-infra-lambdas.sh

      - name: Terraform format check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform init without production backend
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=infra validate

  production-plan:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.AWS_TERRAFORM_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    environment: aws-infra-prod
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Require production Doppler access
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: test -n "$DOPPLER_TOKEN"

      - name: Terraform init
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --no-fallback --project juliusm-infra --config prd -- terraform -chdir=infra init -input=false

      - name: Verify exact production inputs
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --no-fallback --project juliusm-infra --config prd -- sh -c 'test "$TF_VAR_project_name" = juliusm-site && test "$TF_VAR_environment" = dev && test "$TF_VAR_stage_name" = prod && test "$TF_VAR_aws_region" = us-west-2 && test "$TF_VAR_enable_waf" = false && test "$TF_VAR_resume_lambda_arn" && test "$TF_VAR_infer_lambda_arn" && test "$TF_VAR_chat_endpoint_url" && test "$TF_VAR_cloudflare_account_id" && test "$TF_VAR_cloudflare_zone_id" && test "$TF_VAR_cloudflare_zone_name" = juliusm.com && test "$TF_VAR_mcp_public_hostname" = mcp.juliusm.com && test "$TF_VAR_mcp_origin_url" = http://127.0.0.1:8081 && test "$TF_VAR_cloudflare_additional_tunnel_routes" = "{}" && test "$TF_VAR_enable_cloudflare_tunnel" = true && test "$TF_VAR_enable_cloudflare_rate_limits" = false && test "$TF_VAR_enable_ses_domain_identity" = true && test "$TF_VAR_ses_domain" = juliusm.com && test "$TF_VAR_intake_sender_email" = no-reply@juliusm.com && test "$TF_VAR_intake_recipient_email" && test "$CLOUDFLARE_API_TOKEN" && test "$TF_VAR_chat_api_key"'

      - name: Terraform production plan
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --no-fallback --project juliusm-infra --config prd -- terraform -chdir=infra plan -input=false -out=tfplan

      - name: Reject destructive production plan
        run: terraform -chdir=infra show -json tfplan | jq -e '[.resource_changes[]? | select(.change.actions | index("delete"))] | length == 0'

      - name: Record plan review identity
        run: |
          set -euo pipefail
          plan_sha256="$(terraform -chdir=infra show -json tfplan | jq -S -c '{variables,planned_values,resource_changes,output_changes,configuration,checks}' | sha256sum | cut -d ' ' -f1)"
          test "${#plan_sha256}" = 64
          {
            echo "### Production Terraform plan ready for review"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Canonical plan SHA-256: \`${plan_sha256}\`"
            echo
            echo "After reviewing this run, manually dispatch Infra Apply with both values."
            echo "The saved plan is not uploaded because Terraform plan JSON can contain sensitive values."
          } >> "$GITHUB_STEP_SUMMARY"
