name: Infra Apply

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  apply:
    if: ${{ vars.AWS_TERRAFORM_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    environment: aws-infra-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform -chdir=infra init -input=false

      - name: Terraform validate
        run: terraform -chdir=infra validate

      - name: Terraform plan
        run: terraform -chdir=infra plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform -chdir=infra apply -input=false -auto-approve tfplan

  missing-role-config:
    if: ${{ vars.AWS_TERRAFORM_ROLE_ARN == '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Missing role configuration
        run: |
          echo "Skipping infra apply because repo variable AWS_TERRAFORM_ROLE_ARN is not configured."
